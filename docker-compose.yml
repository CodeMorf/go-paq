version: '3.8'

services:
  gopaq-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gopaq-core-api
    restart: always
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      # Leave DATABASE_URL empty for the current production-safe SQLite mode.
      # PostgreSQL support remains available for the async DB layer but is not enabled
      # by default until every legacy synchronous route has been migrated.
      - DATABASE_URL=${DATABASE_URL:-}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - GOPAQ_PUBLIC_ORG_ID=${GOPAQ_PUBLIC_ORG_ID:-org-gopaq}
      - KARRIO_API_URL=${KARRIO_API_URL:-}
      - KARRIO_API_KEY=${KARRIO_API_KEY:-}
      - WITYLOGIX_SERVICE_URL=${WITYLOGIX_SERVICE_URL:-}
      - WITYLOGIX_API_TOKEN=${WITYLOGIX_API_TOKEN:-}
      - WITYLOGIX_TIMEOUT_MS=${WITYLOGIX_TIMEOUT_MS:-8000}
      - WITYLOGIX_ORDERS_PATH=${WITYLOGIX_ORDERS_PATH:-/api/v4/orders}
      - WITYLOGIX_DRIVERS_PATH=${WITYLOGIX_DRIVERS_PATH:-/api/v4/drivers}
      - WITYLOGIX_ROUTES_PATH=${WITYLOGIX_ROUTES_PATH:-/api/v4/routes}
      - WITYLOGIX_HEALTH_PATH=${WITYLOGIX_HEALTH_PATH:-/health}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - gopaq_sqlite_data:/app/server/db

  redis:
    image: redis:7-alpine
    container_name: gopaq-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional PostgreSQL/PostGIS target for the ongoing async DB migration.
  # Start explicitly with: docker compose --profile postgres up -d postgres
  postgres:
    profiles: ["postgres"]
    image: postgis/postgis:16-3.4-alpine
    container_name: gopaq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gopaq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gopaq_password}
      POSTGRES_DB: ${POSTGRES_DB:-gopaq_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gopaq_user} -d ${POSTGRES_DB:-gopaq_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  gopaq_sqlite_data:
  postgres_data:
  redis_data:
