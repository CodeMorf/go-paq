services:
  karrio-api:
    image: karrio.docker.scarf.sh/karrio/server:${KARRIO_TAG:-2026.1.32}
    restart: unless-stopped
    depends_on:
      - karrio-db
      - karrio-redis
    ports:
      - "127.0.0.1:${KARRIO_PORT:-5002}:5002"
    environment:
      USE_HTTPS: "False"
      DEBUG_MODE: "False"
      DETACHED_WORKER: "True"
      SECRET_KEY: ${KARRIO_SECRET_KEY}
      REDIS_PORT: 6379
      REDIS_HOST: karrio-redis
      DATABASE_HOST: karrio-db
      DATABASE_NAME: ${KARRIO_DB_NAME:-karrio}
      DATABASE_PORT: 5432
      DATABASE_ENGINE: postgresql_psycopg2
      DATABASE_USERNAME: ${KARRIO_DB_USER:-karrio}
      DATABASE_PASSWORD: ${KARRIO_DB_PASSWORD}
      ENABLE_ALL_PLUGINS_BY_DEFAULT: "True"
    volumes:
      - karrio_static:/karrio/static
      - ./plugins:/karrio/plugins

  karrio-worker:
    image: karrio.docker.scarf.sh/karrio/server:${KARRIO_TAG:-2026.1.32}
    restart: unless-stopped
    command: "/bin/bash ./worker"
    depends_on:
      - karrio-db
      - karrio-redis
      - karrio-api
    environment:
      DEBUG_MODE: "False"
      REDIS_PORT: 6379
      REDIS_HOST: karrio-redis
      DATABASE_HOST: karrio-db
      DATABASE_NAME: ${KARRIO_DB_NAME:-karrio}
      DATABASE_PORT: 5432
      DATABASE_ENGINE: postgresql_psycopg2
      DATABASE_USERNAME: ${KARRIO_DB_USER:-karrio}
      DATABASE_PASSWORD: ${KARRIO_DB_PASSWORD}
      ENABLE_ALL_PLUGINS_BY_DEFAULT: "True"
    volumes:
      - ./plugins:/karrio/plugins

  karrio-dashboard:
    image: karrio.docker.scarf.sh/karrio/dashboard:${KARRIO_TAG:-2026.1.32}
    restart: unless-stopped
    depends_on:
      - karrio-api
    ports:
      - "127.0.0.1:${KARRIO_DASHBOARD_PORT:-3002}:3002"
    environment:
      NEXTAUTH_SECRET: ${KARRIO_JWT_SECRET}
      DASHBOARD_PORT: 3002
      NEXT_PUBLIC_DASHBOARD_URL: ${KARRIO_DASHBOARD_URL:-http://localhost:3002}
      NEXT_PUBLIC_KARRIO_PUBLIC_URL: ${KARRIO_PUBLIC_URL:-http://localhost:5002}

  karrio-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KARRIO_DB_NAME:-karrio}
      POSTGRES_USER: ${KARRIO_DB_USER:-karrio}
      POSTGRES_PASSWORD: ${KARRIO_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/karrio
    volumes:
      - karrio_db:/var/lib/postgresql/data

  karrio-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - karrio_redis:/data

volumes:
  karrio_static:
  karrio_db:
  karrio_redis:
