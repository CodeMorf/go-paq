name: GoPaq CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Activar pnpm
        uses: pnpm/action-setup@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm check
      - name: Pruebas
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Preflight de producción (sintético)
        env:
          NODE_ENV: production
          DATABASE_URL: ci-placeholder
          JWT_SECRET: ci-placeholder
          VITE_APP_ID: ci-placeholder
          OAUTH_SERVER_URL: https://oauth.invalid
          VITE_OAUTH_PORTAL_URL: https://portal.invalid
          BUILT_IN_FORGE_API_URL: https://forge.invalid
          BUILT_IN_FORGE_API_KEY: ci-placeholder
          REDIS_URL: rediss://redis.invalid:6380
        run: pnpm preflight
