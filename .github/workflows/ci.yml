name: GoPaq CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Activar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm check
      - name: Pruebas
        run: pnpm test
      - name: Build
        run: pnpm build
