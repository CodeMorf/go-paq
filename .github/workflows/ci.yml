name: GoPaq CI

on:
  push:
    branches: [main, 'Morf/**']
  pull_request:

concurrency:
  group: gopaq-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Compose syntax and security review
        run: |
          cp .env.example .env.production
          docker compose --env-file .env.production config --quiet
          if docker compose --env-file .env.production config | grep -Eq '"?(5432|6379):'; then
            echo 'Database or Redis port is publicly published.'
            exit 1
          fi
      - run: npm audit --audit-level=high
